<div *ngIf="isLoading" class="spinner">Chargement en cours...</div>

<div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

@if(successMessage) {
    <div class="success-banner" style="border: 2px solid green; padding: 10px; display: block;">{{ successMessage }}</div>
}

<div class="flex flex-col md:flex-row gap-6 p-4">
    <div class="w-full md:w-[70%]">

        <form [hidden]="isLoading || errorMessage" [formGroup]="parentForm" (ngSubmit)="save()">
        
        <app-profile-form 
        [parentForm]="parentForm"
        (professionSelected)="onProfessionSelected($event)"
        (zoneSelected)="onZoneSelected($event)"
        ></app-profile-form>

        <app-diplome-form [parentForm]="parentForm"></app-diplome-form>

        <button type="submit" class="bg-blue-600 text-white p-2 rounded">
            Sauvegarder les modifications
        </button>
        </form>

    </div>

    <div class="w-full md:w-[30%] flex flex-col items-center p-4 bg-gray-50">
        <div class="relative group">
            <img [src]="getAvatarUrl(parentForm.get('photo_url')?.value)" alt="Photo de profil"
                class="w-100 h-100 rounded-full object-cover border-4 border-white shadow-lg">

            <div *ngIf="isUploading" class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                <div class="bg-blue-600 h-2.5 rounded-full" [style.width.%]="uploadProgress"></div>
            </div>
            
            <button type="button" 
                    (click)="fileInput.click()"
                    class="absolute bottom-0 right-0 bg-blue-600 text-white p-2 rounded-full shadow hover:bg-blue-700">
                <i class="fas fa-pencil-alt text-sm"></i> </button>
            
            <input type="file" #fileInput (change)="onFileSelected($event)" class="hidden" accept=".jpg, .jpeg, .png">
        </div>
        <p class="mt-4 text-sm text-gray-600">Modifier la photo de profil</p>
    </div>
</div>
