<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h2 class="text-2xl font-bold text-gray-800">Liste des Artisans</h2>
    <button (click)="goToCreate()" 
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">
      + Nouvel Artisan
    </button>
  </div>

  <div *ngIf="loading">Chargement...</div>

  <div class="mb-4">
    <input type="text" [(ngModel)]="searchText" placeholder="Rechercher..." 
           class="px-4 py-2 border rounded-lg w-full md:w-1/3">
  </div>

  <div *ngIf="!loading" class="bg-white shadow rounded-lg overflow-hidden border border-gray-200">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-gray-50 border-b">
          <tr>
            <th class="px-6 py-3 text-sm font-semibold text-gray-600">Nom complet</th>
            <th class="px-6 py-3 text-sm font-semibold text-gray-600">Numéro WhatsApp</th>
            <th class="px-6 py-3 text-sm font-semibold text-gray-600">Profession</th>
            <th class="px-6 py-3 text-sm font-semibold text-gray-600">Zone</th>
            <th class="px-6 py-3 text-sm font-semibold text-gray-600">Statut</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          <tr *ngFor="let a of (artisans | filterPipe: searchText | slice: (p - 1) * pageSize: (p - 1) * pageSize + pageSize)" class="hover:bg-gray-50">
            <td class="px-6 py-4">{{ a.firstName }} {{ a.lastName }}</td>
            <td class="px-6 py-4">{{ a.phone_number }}</td>
            <td class="px-6 py-4">{{ a.profession }}</td>
            <td class="px-6 py-4">{{ a.zone }}</td>
            <td class="px-6 py-4">{{ a.verified }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="p-4 flex gap-2">
      <button [disabled]="p === 1" (click)="p = p - 1" class="px-3 py-1 border rounded">Précédent</button>
      <span class="px-3 py-1">Page {{ p }}</span>
      <button (click)="p = p + 1" class="px-3 py-1 border rounded">Suivant</button>
    </div>
    
  </div>
</div>
